<!-- table-details-dialog.component.html -->
<div class="dialog-container">
  <div class="dialog-header">
    <h2 class="dialog-title">Full Details</h2>
    <button class="close-button" (click)="closeDialog()">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 14 14">
        <path id="Path_50" data-name="Path 50" d="M19,6.41,17.59,5,12,10.59,6.41,5,5,6.41,10.59,12,5,17.59,6.41,19,12,13.41,17.59,19,19,17.59,13.41,12Z" transform="translate(-5 -5)" fill="#5f6368"/>
      </svg>
    </button>
  </div>

  <div *ngIf="data?.image" class="img-wrapper">
      <img class="table-image"
           [src]="data?.image?.length ? data?.image : '/assets/images/png/placeholder.png'" [alt]="''">
  </div>

  <div class="dialog-content">
    <table>
      <tbody>
      <tr *ngFor="let item of dataArray; trackBy: trackByFn">
        <td class="label">{{ item.label }}</td>
        <td class="value">{{ item.value }}</td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
